[package]
name = "kiln"
version = "0.1.0"
edition = "2024"
description = "Hardware burn-in and diagnostics runner with a TUI and a headless mode"
license = "MIT"
repository = "https://github.com/ReyArlena/kiln"
readme = "README.md"

[[bin]]
name = "kiln"
path = "src/main.rs"

[lib]
name = "kiln"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
nix = { version = "0.31.3", features = ["signal", "user", "fs"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "process", "sync", "time", "io-util", "signal", "macros", "fs"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
which = "8.0.6"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Hashing in the RAM test is CPU bound; keep it fast even in debug builds.
[profile.dev.package.sha2]
opt-level = 3
