# Builds a static Linux binary and attaches it to the GitHub Release for a tag.
#
# Cut a release with:
#   git tag v0.1.0 && git push origin v0.1.0
# The asset name must match install.sh (kiln-x86_64-unknown-linux-musl).

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with the musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Name the asset
        run: cp target/x86_64-unknown-linux-musl/release/kiln kiln-x86_64-unknown-linux-musl

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: kiln-x86_64-unknown-linux-musl
          generate_release_notes: true
